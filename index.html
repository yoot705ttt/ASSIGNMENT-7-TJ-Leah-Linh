<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Shared Universes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="">
<div class="page">
<!-- FIXED: exhibition name / home link / three universe links. -->
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Shared Universes — home" title="Home">
      <span class="brand-mark" aria-hidden="true"></span><span class="bar brand-bar" aria-hidden="true"></span>
    </a>
    <nav class="universe-nav" aria-label="Choose a universe"><a class="nav-dot tj" href="tj.html" aria-label="TJ's universe" title="TJ's universe"><span aria-hidden="true"></span></a><a class="nav-dot linh" href="linh.html" aria-label="Linh's universe" title="Linh's universe"><span aria-hidden="true"></span></a><a class="nav-dot leah" href="leah.html" aria-label="Leah's universe" title="Leah's universe"><span aria-hidden="true"></span></a></nav>
  </header>
  <main class="entrance" aria-label="Exhibition homepage skeleton">
    <!-- 8 columns: exhibition title + 1–2 sentence curatorial statement. -->
    <section class="cover" aria-label="Exhibition title and statement placeholders">
      <div class="bar eyebrow" aria-hidden="true"></div>
      <div class="title-lines" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
      <div class="statement-lines" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
    </section>
    <!-- 4 columns: three-entry exhibition index placeholder. -->
    <aside class="cover-index" aria-label="Exhibition index placeholder"><div class="index-row tj"><span class="small-orb"></span><span class="bar"></span></div><div class="index-row linh"><span class="small-orb"></span><span class="bar"></span></div><div class="index-row leah"><span class="small-orb"></span><span class="bar"></span></div></aside>
    <!-- 3 equal columns, corresponding to 4 outer grid columns each. -->
    <nav class="universe-grid" aria-label="Enter a universe">
    <!-- TJ's universe: empty cover, student-name and artwork-title slots. -->
    <a class="universe-card tj" href="tj.html" aria-label="Enter TJ's universe" title="Enter TJ's universe">
      <div class="portal" aria-hidden="true"><div class="orbit"><div class="inner-orbit"><div class="planet"></div></div></div></div>
      <div class="card-caption" aria-hidden="true"><div class="caption-lines"><span class="bar"></span><span class="bar"></span></div><span class="arrow"></span></div>
    </a>
    <!-- Linh's universe: empty cover, student-name and artwork-title slots. -->
    <a class="universe-card linh" href="linh.html" aria-label="Enter Linh's universe" title="Enter Linh's universe">
      <div class="portal" aria-hidden="true"><div class="orbit"><div class="inner-orbit"><div class="planet"></div></div></div></div>
      <div class="card-caption" aria-hidden="true"><div class="caption-lines"><span class="bar"></span><span class="bar"></span></div><span class="arrow"></span></div>
    </a>
    <!-- Leah's universe: empty cover, student-name and artwork-title slots. -->
    <a class="universe-card leah" href="leah.html" aria-label="Enter Leah's universe" title="Enter Leah's universe">
      <div class="portal" aria-hidden="true"><div class="orbit"><div class="inner-orbit"><div class="planet"></div></div></div></div>
      <div class="card-caption" aria-hidden="true"><div class="caption-lines"><span class="bar"></span><span class="bar"></span></div><span class="arrow"></span></div>
    </a>
    </nav>
  </main>
<footer class="site-footer">
    <div class="footer-bars" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
    <nav class="page-navigation" aria-label="Exhibition navigation"><a class="icon-button" href="index.html" aria-label="Home" title="Home"><span class="home-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></span></a><a class="icon-button" href="tj.html" aria-label="Next universe" title="Next universe"><span class="arrow" aria-hidden="true"></span></a></nav>
  </footer>
</div>
</body>
</html>
