<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJ's Universe | Shared Universes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tj">
<div class="page">
<!-- FIXED: exhibition name / home link / three universe links. -->
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Shared Universes — home" title="Home">
      <span class="brand-mark" aria-hidden="true"></span><span class="bar brand-bar" aria-hidden="true"></span>
    </a>
    <nav class="universe-nav" aria-label="Choose a universe"><a class="nav-dot tj" href="tj.html" aria-label="TJ's universe" title="TJ's universe" aria-current="page"><span aria-hidden="true"></span></a><a class="nav-dot linh" href="linh.html" aria-label="Linh's universe" title="Linh's universe"><span aria-hidden="true"></span></a><a class="nav-dot leah" href="leah.html" aria-label="Leah's universe" title="Leah's universe"><span aria-hidden="true"></span></a></nav>
  </header>
  <main class="artwork-grid" aria-label="TJ's universe skeleton">
    <!-- FIXED: student/universe heading, spans every template column. -->
    <section class="universe-heading" aria-label="Universe heading placeholder">
      <div class="heading-lines" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
      <div class="heading-orb" aria-hidden="true"><span></span></div>
    </section>
    <!-- FIXED: original artwork slot. FREE: actual content inside work-area. -->
    <section class="work-panel original-work" aria-label="Original artwork placeholder">
      <div class="panel-heading" aria-hidden="true"><span class="bar"></span></div>
      <div class="work-area" aria-hidden="true"><div class="work-placeholder"></div></div>
    </section>
    <!-- FIXED: CSS recreation slot. FREE: student's CSS inside work-area. -->
    <section class="work-panel css-work" aria-label="CSS recreation placeholder">
      <div class="panel-heading" aria-hidden="true"><span class="bar"></span></div>
      <div class="work-area" aria-hidden="true"><div class="work-placeholder"></div></div>
    </section>
    <!-- FIXED: wall label, 5 metadata fields. -->
    <aside class="wall-label" aria-label="Artwork metadata placeholders">
      <!-- Artist placeholder. --><div class="label-field" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
      <!-- Artwork title placeholder. --><div class="label-field" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
      <!-- Year placeholder. --><div class="label-field" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
      <!-- Medium placeholder. --><div class="label-field" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
      <!-- Museum placeholder. --><div class="label-field" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
    </aside>
    <!-- FIXED: student name + personal statement beneath comparison. -->
    <section class="student-statement" aria-label="Student name and statement placeholders">
      <span class="bar" aria-hidden="true"></span>
      <div class="paragraph-lines" aria-hidden="true"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
      <div class="paragraph-lines" aria-hidden="true"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
    </section>
  </main>
<footer class="site-footer">
    <div class="footer-bars" aria-hidden="true"><span class="bar"></span><span class="bar"></span></div>
    <nav class="page-navigation" aria-label="Exhibition navigation"><a class="icon-button" href="leah.html" aria-label="Previous universe" title="Previous universe"><span class="arrow arrow-back" aria-hidden="true"></span></a><a class="icon-button" href="index.html" aria-label="Home" title="Home"><span class="home-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></span></a><a class="icon-button" href="linh.html" aria-label="Next universe" title="Next universe"><span class="arrow" aria-hidden="true"></span></a></nav>
  </footer>
</div>
</body>
</html>
